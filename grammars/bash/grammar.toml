name = "bash"
repository = "https://github.com/tree-sitter/tree-sitter-bash"
revision = "a06c2e4415e9bc0346c6b86d401879ffb44058f7"
path = "."
language = "bash"
license = "MIT"
scope = "source.bash"
injection_regex = "^(shell|bash|sh)$"

[files]
extensions = ["sh", "bash", "ebuild", "eclass"]
names = [".bashrc", ".bash_profile"]
first_line_regex = "^#!.*\\b(sh|bash|dash)\\b.*$"

[queries]
highlights = "highlights.scm"

[query-sources]
highlights = ["bash:queries/highlights.scm"]
