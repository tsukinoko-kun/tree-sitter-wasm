name: Build and publish registry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify all grammars
    runs-on: ubuntu-latest
    steps:
      - name: Check out registry
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Cache grammar sources and build tools
        uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/sources
            .cache/tools
            ~/.cache/tree-sitter
          key: tree-sitter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('registry.toml', 'grammars/*/grammar.toml') }}
          restore-keys: tree-sitter-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate registry metadata
        run: scripts/validate
      - name: Test registry scripts
        run: python3 -m unittest discover -s tests
      - name: Build WASM parsers and verify published files
        run: scripts/build-all
      - name: Upload registry for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Publish registry to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy registry
        id: deployment
        uses: actions/deploy-pages@v5.0.1
