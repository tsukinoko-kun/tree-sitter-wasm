name = "cpp"
repository = "https://github.com/tree-sitter/tree-sitter-cpp"
revision = "c009222808634c1014f82438d4883753516a2c24"
path = "."
language = "cpp"
license = "MIT"
scope = "source.cpp"
injection_regex = "^(cc|cpp)$"

[files]
extensions = ["cc", "cpp", "cxx", "hpp", "hxx", "h"]

